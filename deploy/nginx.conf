# /etc/nginx/sites-available/chauffr — replace example.com with your domain, then:
#   sudo ln -s /etc/nginx/sites-available/chauffr /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d app.example.com -d driver.example.com -d admin.example.com
# HTTPS is required: PWAs, Google sign-in and location access don't work over plain HTTP.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream chauffr_api {
    server 127.0.0.1:3000;
}

# Each site serves its own build and proxies /api to the single API server.

server {
    listen 80;
    server_name app.example.com;
    root /srv/chauffr/apps/customer/dist;

    location /api/ {
        proxy_pass http://chauffr_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri /index.html; }
}

server {
    listen 80;
    server_name driver.example.com;
    root /srv/chauffr/apps/driver/dist;

    location /api/ {
        proxy_pass http://chauffr_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri /index.html; }
}

server {
    listen 80;
    server_name admin.example.com;
    root /srv/chauffr/apps/admin/dist;

    location /api/ {
        proxy_pass http://chauffr_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri /index.html; }
}
